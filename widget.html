<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Is Outlook Up? — Live Status Widget</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-primary: #0a0e1a;
    --bg-card: rgba(15, 20, 35, 0.85);
    --bg-card-hover: rgba(20, 28, 50, 0.95);
    --bg-row: rgba(255, 255, 255, 0.03);
    --bg-row-hover: rgba(255, 255, 255, 0.06);
    --border: rgba(255, 255, 255, 0.06);
    --border-glow: rgba(100, 120, 255, 0.15);
    --text-primary: #e8ecf4;
    --text-secondary: #8892a8;
    --text-muted: #5a6478;
    --up: #34d399;
    --up-bg: rgba(52, 211, 153, 0.08);
    --up-glow: rgba(52, 211, 153, 0.25);
    --down: #f87171;
    --down-bg: rgba(248, 113, 113, 0.08);
    --down-glow: rgba(248, 113, 113, 0.25);
    --degraded: #fbbf24;
    --degraded-bg: rgba(251, 191, 36, 0.08);
    --degraded-glow: rgba(251, 191, 36, 0.25);
    --accent: #818cf8;
    --accent-dim: rgba(129, 140, 248, 0.15);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    -webkit-font-smoothing: antialiased;
  }

  /* === WIDGET CONTAINER === */
  .widget {
    width: 100%;
    max-width: 480px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    backdrop-filter: blur(20px);
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.03),
      0 4px 24px rgba(0,0,0,0.4),
      0 0 60px rgba(100, 120, 255, 0.03);
    transition: box-shadow 0.4s ease;
  }

  .widget:hover {
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.05),
      0 8px 40px rgba(0,0,0,0.5),
      0 0 80px rgba(100, 120, 255, 0.06);
  }

  /* === HEADER === */
  .widget-header {
    padding: 20px 24px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .widget-header-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .widget-logo {
    width: 28px;
    height: 28px;
    border-radius: 8px;
    background: linear-gradient(135deg, #0078d4, #00bcf2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 800;
    color: white;
    flex-shrink: 0;
  }

  .widget-title {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: -0.3px;
    color: var(--text-primary);
  }

  .widget-subtitle {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 1px;
    font-weight: 500;
  }

  /* === OVERALL STATUS BANNER === */
  .status-banner {
    padding: 14px 24px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid var(--border);
    transition: background 0.3s ease;
  }

  .status-banner.all-up {
    background: var(--up-bg);
  }

  .status-banner.some-down {
    background: var(--down-bg);
  }

  .status-banner.degraded {
    background: var(--degraded-bg);
  }

  .status-pulse {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
    position: relative;
  }

  .status-pulse::after {
    content: '';
    position: absolute;
    inset: -3px;
    border-radius: 50%;
    animation: pulse 2s ease-in-out infinite;
  }

  .status-pulse.up { background: var(--up); }
  .status-pulse.up::after { box-shadow: 0 0 8px var(--up-glow); }
  .status-pulse.down { background: var(--down); }
  .status-pulse.down::after { box-shadow: 0 0 8px var(--down-glow); }
  .status-pulse.degraded { background: var(--degraded); }
  .status-pulse.degraded::after { box-shadow: 0 0 8px var(--degraded-glow); }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(1.6); }
  }

  .status-banner-text {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: -0.2px;
  }

  .status-banner.all-up .status-banner-text { color: var(--up); }
  .status-banner.some-down .status-banner-text { color: var(--down); }
  .status-banner.degraded .status-banner-text { color: var(--degraded); }

  /* === SERVICES LIST === */
  .services {
    padding: 4px 0;
  }

  .service-row {
    display: flex;
    align-items: center;
    padding: 10px 24px;
    gap: 12px;
    transition: background 0.2s ease;
    cursor: default;
  }

  .service-row:hover {
    background: var(--bg-row-hover);
  }

  .service-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    flex-shrink: 0;
    transition: box-shadow 0.3s ease;
  }

  .service-dot.up {
    background: var(--up);
    box-shadow: 0 0 6px var(--up-glow);
  }

  .service-dot.down {
    background: var(--down);
    box-shadow: 0 0 6px var(--down-glow);
  }

  .service-dot.degraded {
    background: var(--degraded);
    box-shadow: 0 0 6px var(--degraded-glow);
  }

  .service-info {
    flex: 1;
    min-width: 0;
  }

  .service-name {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    letter-spacing: -0.1px;
  }

  .service-meta {
    font-size: 10.5px;
    color: var(--text-muted);
    margin-top: 1px;
    font-weight: 500;
  }

  .service-badge {
    font-size: 10px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 6px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    flex-shrink: 0;
  }

  .service-badge.up {
    background: var(--up-bg);
    color: var(--up);
    border: 1px solid rgba(52, 211, 153, 0.15);
  }

  .service-badge.down {
    background: var(--down-bg);
    color: var(--down);
    border: 1px solid rgba(248, 113, 113, 0.15);
  }

  .service-badge.degraded {
    background: var(--degraded-bg);
    color: var(--degraded);
    border: 1px solid rgba(251, 191, 36, 0.15);
  }

  /* === CATEGORY DIVIDERS === */
  .category-label {
    padding: 10px 24px 4px;
    font-size: 9.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: var(--text-muted);
  }

  .category-label:not(:first-child) {
    border-top: 1px solid var(--border);
    margin-top: 4px;
    padding-top: 12px;
  }

  /* === UPTIME BAR === */
  .uptime-bar-container {
    padding: 12px 24px 16px;
    border-top: 1px solid var(--border);
  }

  .uptime-bar-label {
    display: flex;
    justify-content: space-between;
    margin-bottom: 6px;
  }

  .uptime-bar-label span {
    font-size: 10px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.8px;
  }

  .uptime-bar-label .uptime-pct {
    color: var(--text-secondary);
  }

  .uptime-bar {
    height: 6px;
    background: rgba(255, 255, 255, 0.04);
    border-radius: 3px;
    overflow: hidden;
  }

  .uptime-bar-fill {
    height: 100%;
    border-radius: 3px;
    transition: width 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    background: linear-gradient(90deg, var(--up), #2dd4bf);
  }

  .uptime-bar-fill.degraded {
    background: linear-gradient(90deg, var(--degraded), #f59e0b);
  }

  .uptime-bar-fill.critical {
    background: linear-gradient(90deg, var(--down), #ef4444);
  }

  /* === FOOTER === */
  .widget-footer {
    padding: 10px 24px 14px;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .widget-footer-left {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .live-dot {
    width: 5px;
    height: 5px;
    background: var(--up);
    border-radius: 50%;
    animation: pulse 2s ease-in-out infinite;
  }

  .widget-footer span {
    font-size: 10px;
    color: var(--text-muted);
    font-weight: 500;
  }

  .widget-footer a {
    font-size: 10px;
    color: var(--accent);
    text-decoration: none;
    font-weight: 600;
    transition: opacity 0.2s;
  }

  .widget-footer a:hover {
    opacity: 0.8;
  }

  /* === LOADING STATE === */
  .loading {
    padding: 60px 24px;
    text-align: center;
  }

  .loading-spinner {
    width: 24px;
    height: 24px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 12px;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .loading-text {
    font-size: 12px;
    color: var(--text-muted);
    font-weight: 500;
  }

  /* === ERROR STATE === */
  .error-state {
    padding: 40px 24px;
    text-align: center;
  }

  .error-icon {
    font-size: 24px;
    margin-bottom: 8px;
  }

  .error-text {
    font-size: 12px;
    color: var(--text-muted);
  }

  .retry-btn {
    margin-top: 12px;
    padding: 6px 16px;
    font-size: 11px;
    font-weight: 600;
    color: var(--accent);
    background: var(--accent-dim);
    border: 1px solid rgba(129, 140, 248, 0.2);
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .retry-btn:hover {
    background: rgba(129, 140, 248, 0.2);
  }

  /* === RESPONSIVE === */
  @media (max-width: 360px) {
    .widget { border-radius: 12px; }
    .widget-header, .service-row, .uptime-bar-container, .widget-footer,
    .category-label { padding-left: 16px; padding-right: 16px; }
  }
</style>
</head>
<body>

<div class="widget" id="statusWidget">
  <div class="widget-header">
    <div class="widget-header-left">
      <div class="widget-logo">✉</div>
      <div>
        <div class="widget-title">Is Outlook Up?</div>
        <div class="widget-subtitle">Real-time Microsoft Outlook monitoring</div>
      </div>
    </div>
  </div>

  <div id="widgetContent">
    <div class="loading">
      <div class="loading-spinner"></div>
      <div class="loading-text">Checking services...</div>
    </div>
  </div>
</div>

<script>
(function() {
  const CONFIG = {
    owner: 'TheAnomalous',
    repo: 'isitup',
    refreshInterval: 60000, // 1 minute
    statusPageUrl: 'https://theanomalous.github.io/isitup/',
    categories: {
      'Web Access': [
        'outlook-web',
        'outlook-365',
        'outlook-office',
        'microsoft-365'
      ],
      'Authentication': [
        'outlook-login',
        'azure-ad'
      ],
      'APIs & Backend': [
        'microsoft-graph',
        'outlook-mobile'
      ],
      'Mail Infrastructure': [
        'outlook-mx',
        'outlook-smtp',
        'outlook-imap'
      ]
    }
  };

  function categorizeService(service) {
    const slug = service.slug.toLowerCase();
    const name = service.name.toLowerCase();
    for (const [cat, keywords] of Object.entries(CONFIG.categories)) {
      for (const kw of keywords) {
        if (slug.includes(kw) || name.includes(kw)) return cat;
      }
    }
    return 'Other';
  }

  function getServiceLabel(service) {
    // Shorten names for the widget display
    return service.name
      .replace(/\s*\(.*?\)\s*/g, '')
      .replace('Outlook REST API', 'Outlook 365 API')
      .replace('Outlook Mail API', 'Outlook Mail')
      .replace('Microsoft ', 'M365 ')
      .replace('Outlook Mobile Sync', 'Mobile Sync')
      .replace('Outlook DNS', 'Mail Exchange (MX)')
      .replace('Outlook MX', 'Mail Delivery (MX)')
      .replace('Outlook SMTP', 'SMTP Outbound')
      .replace('Outlook IMAP', 'IMAP Access');
  }

  function getStatusClass(service) {
    if (service.status === 'up') return 'up';
    if (service.status === 'degraded') return 'degraded';
    return 'down';
  }

  function calcOverallUptime(services) {
    const uptimes = services.map(s => parseFloat(s.uptimeDay) || 0);
    return (uptimes.reduce((a, b) => a + b, 0) / uptimes.length).toFixed(1);
  }

  function timeSince(date) {
    const seconds = Math.floor((new Date() - date) / 1000);
    if (seconds < 60) return 'just now';
    if (seconds < 3600) return Math.floor(seconds / 60) + 'm ago';
    if (seconds < 86400) return Math.floor(seconds / 3600) + 'h ago';
    return Math.floor(seconds / 86400) + 'd ago';
  }

  function render(services) {
    const content = document.getElementById('widgetContent');
    const upCount = services.filter(s => s.status === 'up').length;
    const downCount = services.filter(s => s.status === 'down').length;
    const degradedCount = services.filter(s => s.status === 'degraded').length;
    const total = services.length;
    const overall = calcOverallUptime(services);

    // Banner
    let bannerClass, bannerText, pulseClass;
    if (downCount === 0 && degradedCount === 0) {
      bannerClass = 'all-up';
      pulseClass = 'up';
      bannerText = `All ${total} services operational`;
    } else if (downCount > 0) {
      bannerClass = 'some-down';
      pulseClass = 'down';
      bannerText = `${downCount} of ${total} service${downCount > 1 ? 's' : ''} down`;
    } else {
      bannerClass = 'degraded';
      pulseClass = 'degraded';
      bannerText = `${degradedCount} service${degradedCount > 1 ? 's' : ''} degraded`;
    }

    // Group by category
    const grouped = {};
    services.forEach(s => {
      const cat = categorizeService(s);
      if (!grouped[cat]) grouped[cat] = [];
      grouped[cat].push(s);
    });

    // Category order
    const catOrder = ['Web Access', 'Authentication', 'APIs & Backend', 'Mail Infrastructure', 'Other'];

    let servicesHtml = '';
    for (const cat of catOrder) {
      if (!grouped[cat]) continue;
      servicesHtml += `<div class="category-label">${cat}</div>`;
      for (const s of grouped[cat]) {
        const cls = getStatusClass(s);
        const label = getServiceLabel(s);
        const badge = s.status === 'up' ? 'UP' : s.status === 'degraded' ? 'SLOW' : 'DOWN';
        const responseTime = s.time ? `${s.time}ms` : '—';
        servicesHtml += `
          <div class="service-row">
            <div class="service-dot ${cls}"></div>
            <div class="service-info">
              <div class="service-name">${label}</div>
              <div class="service-meta">${s.uptimeDay} uptime · ${responseTime}</div>
            </div>
            <div class="service-badge ${cls}">${badge}</div>
          </div>`;
      }
    }

    // Uptime bar color
    let barClass = '';
    if (overall < 50) barClass = 'critical';
    else if (overall < 95) barClass = 'degraded';

    content.innerHTML = `
      <div class="status-banner ${bannerClass}">
        <div class="status-pulse ${pulseClass}"></div>
        <div class="status-banner-text">${bannerText}</div>
      </div>
      <div class="services">${servicesHtml}</div>
      <div class="uptime-bar-container">
        <div class="uptime-bar-label">
          <span>Overall Uptime (24h)</span>
          <span class="uptime-pct">${overall}%</span>
        </div>
        <div class="uptime-bar">
          <div class="uptime-bar-fill ${barClass}" style="width: ${overall}%"></div>
        </div>
      </div>
      <div class="widget-footer">
        <div class="widget-footer-left">
          <div class="live-dot"></div>
          <span>Updated ${timeSince(new Date())}</span>
        </div>
        <a href="${CONFIG.statusPageUrl}" target="_blank" rel="noopener">Full status page →</a>
      </div>`;
  }

  function renderError(msg) {
    document.getElementById('widgetContent').innerHTML = `
      <div class="error-state">
        <div class="error-icon">⚠️</div>
        <div class="error-text">${msg}</div>
        <button class="retry-btn" onclick="window.__isitup_fetch()">Retry</button>
      </div>`;
  }

  async function fetchStatus() {
    try {
      const url = `https://raw.githubusercontent.com/${CONFIG.owner}/${CONFIG.repo}/master/history/summary.json`;
      const resp = await fetch(url + '?t=' + Date.now());
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      const data = await resp.json();
      render(data);
    } catch (e) {
      console.error('Status fetch failed:', e);
      renderError('Unable to fetch status data');
    }
  }

  window.__isitup_fetch = fetchStatus;
  fetchStatus();
  setInterval(fetchStatus, CONFIG.refreshInterval);
})();
</script>
</body>
</html>
