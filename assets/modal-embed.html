<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Email Status</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: transparent;
    color: #1e293b;
    -webkit-font-smoothing: antialiased;
  }

  .status-card {
    width: 100%;
    max-width: 440px;
    margin: 0 auto;
    text-align: center;
    padding: 10px 0 0;
  }

  /* === ICON === */
  .status-icon {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    margin: 0 auto 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    font-weight: 800;
    line-height: 1;
  }

  .status-icon.down {
    background: #fee2e2;
    color: #dc2626;
    box-shadow: 0 0 0 4px #fecaca;
    animation: pulse 2s ease-in-out infinite;
  }

  .status-icon.ok {
    background: #dcfce7;
    color: #16a34a;
    box-shadow: 0 0 0 4px #bbf7d0;
  }

  .status-icon.slow {
    background: #fef3c7;
    color: #d97706;
    box-shadow: 0 0 0 4px #fde68a;
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 4px #fecaca; }
    50% { box-shadow: 0 0 0 8px rgba(254, 202, 202, 0.3); }
  }

  /* === HEADLINE === */
  .status-headline {
    font-size: 18px;
    font-weight: 800;
    letter-spacing: -0.4px;
    margin-bottom: 10px;
  }

  .status-headline.down { color: #dc2626; }
  .status-headline.ok { color: #16a34a; }
  .status-headline.slow { color: #d97706; }

  /* === BODY TEXT === */
  .status-body {
    font-size: 13.5px;
    color: #444;
    line-height: 1.6;
    margin-bottom: 14px;
    padding: 0 8px;
  }

  /* === PHONE CTA === */
  .phone-cta {
    display: inline-block;
    font-size: 15px;
    font-weight: 700;
    color: #0055a4;
    margin-bottom: 14px;
    text-decoration: none;
  }

  .phone-cta:hover { opacity: 0.7; }

  /* === DETAILS LINK === */
  .details-link {
    display: inline-block;
    font-size: 12px;
    font-weight: 600;
    color: #0055a4;
    text-decoration: none;
    margin-bottom: 8px;
  }

  .details-link:hover { text-decoration: underline; }

  /* === FOOTER === */
  .status-footer {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
  }

  .status-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    animation: blink 2s ease-in-out infinite;
  }

  .status-dot.live { background: #10b981; }
  .status-dot.alert { background: #ef4444; }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .status-footer span {
    font-size: 10px;
    color: #a7a9ac;
    font-weight: 500;
  }

  /* === LOADING === */
  .loading { padding: 30px; text-align: center; }

  .loading-spinner {
    width: 20px; height: 20px;
    border: 2.5px solid #e2e8f0;
    border-top-color: #0055a4;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin: 0 auto 8px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { font-size: 12px; color: #a7a9ac; }
</style>
</head>
<body>

<div class="status-card" id="statusCard">
  <div class="loading">
    <div class="loading-spinner"></div>
    <div class="loading-text">Checking email service...</div>
  </div>
</div>

<script>
(function() {
  const CONFIG = {
    owner: 'TheAnomalous',
    repo: 'isitup',
    refreshInterval: 60000
  };

  function render(services) {
    const el = document.getElementById('statusCard');
    const downCount = services.filter(s => s.status === 'down').length;
    const allUp = downCount === 0;
    const degraded = !allUp && downCount <= 1;

    let icon, iconCls, headline, headlineCls, body, dotCls;

    if (allUp) {
      icon = '✓'; iconCls = 'ok';
      headline = 'Email Is Working'; headlineCls = 'ok';
      body = 'Our email is fully operational. You can send us a message and expect a timely response.';
      dotCls = 'live';
    } else if (degraded) {
      icon = '!'; iconCls = 'slow';
      headline = 'Email May Be Delayed'; headlineCls = 'slow';
      body = 'Microsoft is experiencing minor issues that may delay email delivery. Our team is still working on your files. If you need a quick response, please call your loan officer directly — find their number on our <a href="https://mortgageonegr.com/team/" target="_blank" style="color:#0055a4;font-weight:600;">Meet The Team</a> page.';
      dotCls = 'alert';
    } else {
      icon = '✕'; iconCls = 'down';
      headline = 'Email Is Currently Down'; headlineCls = 'down';
      body = 'A widespread Microsoft Outlook outage is preventing us from sending or receiving email. Our team is still working on your files. For anything time-sensitive, please call your loan officer or team directly — find their number on our <a href="https://mortgageonegr.com/team/" target="_blank" style="color:#0055a4;font-weight:600;">Meet The Team</a> page.';
      dotCls = 'alert';
    }

    el.innerHTML = `
      <div class="status-icon ${iconCls}">${icon}</div>
      <div class="status-headline ${headlineCls}">${headline}</div>
      <div class="status-body">${body}</div>
      <a class="details-link" href="https://theanomalous.github.io/isitup/widget.html" target="_blank">View Detailed Status →</a>
      <div class="status-footer">
        <div class="status-dot ${dotCls}"></div>
        <span>Live · Checked every 5 min</span>
      </div>`;
  }

  async function fetchStatus() {
    try {
      const url = `https://raw.githubusercontent.com/${CONFIG.owner}/${CONFIG.repo}/master/history/summary.json`;
      const resp = await fetch(url + '?t=' + Date.now());
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      render(await resp.json());
    } catch (e) {
      console.error('Fetch failed:', e);
      document.getElementById('statusCard').innerHTML = `
        <div class="loading">
          <div class="loading-text">⚠️ Unable to check email status</div>
        </div>`;
    }
  }

  fetchStatus();
  setInterval(fetchStatus, CONFIG.refreshInterval);
})();
</script>
</body>
</html>
