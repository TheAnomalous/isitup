<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Email Status</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: transparent;
    color: #1e293b;
    -webkit-font-smoothing: antialiased;
  }

  .status-card {
    width: 100%;
    max-width: 400px;
    margin: 0 auto;
    text-align: center;
    padding: 4px 0;
  }

  /* === BIG STATUS INDICATOR === */
  .status-ring {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    margin: 0 auto 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    transition: all 0.5s ease;
  }

  .status-ring.ok {
    background: #dcfce7;
    box-shadow: 0 0 0 5px #bbf7d0;
  }

  .status-ring.down {
    background: #fee2e2;
    box-shadow: 0 0 0 5px #fecaca;
    animation: ring-pulse 2s ease-in-out infinite;
  }

  .status-ring.slow {
    background: #fef3c7;
    box-shadow: 0 0 0 5px #fde68a;
  }

  @keyframes ring-pulse {
    0%, 100% { box-shadow: 0 0 0 5px #fecaca; }
    50% { box-shadow: 0 0 0 10px rgba(254, 202, 202, 0.4); }
  }

  /* === HEADLINE === */
  .status-headline {
    font-size: 18px;
    font-weight: 800;
    letter-spacing: -0.4px;
    margin-bottom: 8px;
    line-height: 1.2;
  }

  .status-headline.ok { color: #16a34a; }
  .status-headline.down { color: #dc2626; }
  .status-headline.slow { color: #d97706; }

  /* === EXPLANATION === */
  .status-explain {
    font-size: 13.5px;
    color: #475569;
    line-height: 1.55;
    margin-bottom: 12px;
    padding: 0 4px;
  }

  /* === FOOTER === */
  .status-footer {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding-top: 6px;
  }

  .status-footer-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    animation: blink 2s ease-in-out infinite;
  }

  .status-footer-dot.live { background: #10b981; }
  .status-footer-dot.alert { background: #ef4444; }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .status-footer span {
    font-size: 10px;
    color: #94a3b8;
    font-weight: 500;
  }

  /* === LOADING === */
  .loading {
    padding: 36px;
    text-align: center;
  }

  .loading-spinner {
    width: 22px;
    height: 22px;
    border: 2.5px solid #e2e8f0;
    border-top-color: #6366f1;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin: 0 auto 10px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .loading-text {
    font-size: 13px;
    color: #94a3b8;
  }
</style>
</head>
<body>

<div class="status-card" id="statusCard">
  <div class="loading">
    <div class="loading-spinner"></div>
    <div class="loading-text">Checking email service...</div>
  </div>
</div>

<script>
(function() {
  const CONFIG = {
    owner: 'TheAnomalous',
    repo: 'isitup',
    refreshInterval: 60000
  };

  function render(services) {
    const el = document.getElementById('statusCard');
    const downCount = services.filter(s => s.status === 'down').length;
    const total = services.length;
    const allUp = downCount === 0;
    const degraded = !allUp && downCount <= 1;

    let ring, emoji, headline, headlineCls, explain, dotCls;

    if (allUp) {
      ring = 'ok';
      emoji = '✅';
      headline = 'Email Is Working';
      headlineCls = 'ok';
      explain = 'Our email is fully operational. You can send us a message and expect a timely response.';
      dotCls = 'live';
    } else if (degraded) {
      ring = 'slow';
      emoji = '⚠️';
      headline = 'Email May Be Delayed';
      headlineCls = 'slow';
      explain = 'Microsoft is experiencing minor issues. Emails may be delayed. If your matter is urgent, please call us directly.';
      dotCls = 'alert';
    } else {
      ring = 'down';
      emoji = '🚫';
      headline = 'Email Is Down';
      headlineCls = 'down';
      explain = 'Microsoft Outlook is experiencing a nationwide outage. We cannot send or receive emails right now. Please call us directly for immediate assistance.';
      dotCls = 'alert';
    }

    el.innerHTML = `
      <div class="status-ring ${ring}">${emoji}</div>
      <div class="status-headline ${headlineCls}">${headline}</div>
      <div class="status-explain">${explain}</div>
      <div class="status-footer">
        <div class="status-footer-dot ${dotCls}"></div>
        <span>Live · Checked every 5 min</span>
      </div>`;
  }

  async function fetchStatus() {
    try {
      const url = `https://raw.githubusercontent.com/${CONFIG.owner}/${CONFIG.repo}/master/history/summary.json`;
      const resp = await fetch(url + '?t=' + Date.now());
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      render(await resp.json());
    } catch (e) {
      console.error('Fetch failed:', e);
      document.getElementById('statusCard').innerHTML = `
        <div class="loading">
          <div class="loading-text">⚠️ Unable to check email status</div>
        </div>`;
    }
  }

  fetchStatus();
  setInterval(fetchStatus, CONFIG.refreshInterval);
})();
</script>
</body>
</html>
