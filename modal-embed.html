<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Outlook Status — Modal Embed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: transparent;
    color: #1e293b;
    -webkit-font-smoothing: antialiased;
  }

  .modal-status {
    width: 100%;
    max-width: 460px;
    margin: 0 auto;
  }

  /* === SEVERITY HEADER === */
  .sev-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
  }

  .sev-icon {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 20px;
    transition: background 0.4s ease;
  }

  .sev-icon.operational { background: #dcfce7; }
  .sev-icon.minor { background: #fef9c3; }
  .sev-icon.degraded { background: #fed7aa; }
  .sev-icon.outage { background: #fecaca; }
  .sev-icon.critical { background: #fecaca; }

  .sev-title {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: -0.3px;
    color: #0f172a;
    line-height: 1.3;
  }

  .sev-subtitle {
    font-size: 12px;
    color: #64748b;
    font-weight: 500;
    margin-top: 1px;
  }

  /* === HEALTH BAR === */
  .health-bar-wrap {
    margin-bottom: 18px;
  }

  .health-bar-labels {
    display: flex;
    justify-content: space-between;
    margin-bottom: 5px;
  }

  .health-bar-labels span {
    font-size: 10px;
    font-weight: 600;
    color: #94a3b8;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .health-bar-labels .health-pct {
    font-weight: 700;
    color: #475569;
  }

  .health-bar {
    height: 8px;
    background: #f1f5f9;
    border-radius: 4px;
    overflow: hidden;
    position: relative;
  }

  .health-bar-fill {
    height: 100%;
    border-radius: 4px;
    transition: width 1s cubic-bezier(0.16, 1, 0.3, 1), background 0.5s ease;
  }

  .health-bar-fill.green { background: linear-gradient(90deg, #34d399, #10b981); }
  .health-bar-fill.yellow { background: linear-gradient(90deg, #fbbf24, #f59e0b); }
  .health-bar-fill.orange { background: linear-gradient(90deg, #fb923c, #f97316); }
  .health-bar-fill.red { background: linear-gradient(90deg, #f87171, #ef4444); }

  /* === SERVICE GRID === */
  .service-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    margin-bottom: 16px;
  }

  .svc {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    transition: border-color 0.2s, background 0.2s;
  }

  .svc:hover {
    background: #f1f5f9;
    border-color: #cbd5e1;
  }

  .svc-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .svc-dot.up { background: #10b981; box-shadow: 0 0 4px rgba(16, 185, 129, 0.3); }
  .svc-dot.down { background: #ef4444; box-shadow: 0 0 4px rgba(239, 68, 68, 0.3); animation: blink 1.5s ease-in-out infinite; }
  .svc-dot.degraded { background: #f59e0b; box-shadow: 0 0 4px rgba(245, 158, 11, 0.3); }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .svc-info {
    flex: 1;
    min-width: 0;
  }

  .svc-name {
    font-size: 11px;
    font-weight: 600;
    color: #334155;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .svc-meta {
    font-size: 9.5px;
    color: #94a3b8;
    font-weight: 500;
    margin-top: 1px;
  }

  .svc-badge {
    font-size: 8px;
    font-weight: 800;
    padding: 2px 6px;
    border-radius: 4px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    flex-shrink: 0;
  }

  .svc-badge.up { background: #dcfce7; color: #16a34a; }
  .svc-badge.down { background: #fee2e2; color: #dc2626; }
  .svc-badge.degraded { background: #fef3c7; color: #d97706; }

  /* === FOOTER === */
  .modal-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 12px;
    border-top: 1px solid #e2e8f0;
  }

  .modal-footer-left {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .live-pip {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #10b981;
    animation: blink 2s ease-in-out infinite;
  }

  .live-pip.warn { background: #f59e0b; }
  .live-pip.alert { background: #ef4444; }

  .modal-footer span {
    font-size: 10px;
    color: #94a3b8;
    font-weight: 500;
  }

  .modal-footer a {
    font-size: 10px;
    color: #6366f1;
    text-decoration: none;
    font-weight: 600;
  }

  .modal-footer a:hover { text-decoration: underline; }

  /* === LOADING === */
  .loading {
    padding: 32px;
    text-align: center;
  }

  .loading-spinner {
    width: 20px;
    height: 20px;
    border: 2px solid #e2e8f0;
    border-top-color: #6366f1;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin: 0 auto 8px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .loading-text {
    font-size: 11px;
    color: #94a3b8;
  }
</style>
</head>
<body>

<div class="modal-status" id="modalStatus">
  <div class="loading">
    <div class="loading-spinner"></div>
    <div class="loading-text">Checking Outlook services...</div>
  </div>
</div>

<script>
(function() {
  const CONFIG = {
    owner: 'TheAnomalous',
    repo: 'isitup',
    statusPageUrl: 'https://theanomalous.github.io/isitup/',
    refreshInterval: 60000
  };

  const SEVERITY = [
    { min: 95, icon: '✅', cls: 'operational', title: 'All Systems Operational',           desc: 'All Microsoft Outlook services are running normally.' },
    { min: 85, icon: '⚠️', cls: 'minor',       title: 'Minor Disruption Detected',         desc: 'Some Outlook services may be experiencing slight delays.' },
    { min: 70, icon: '⚠️', cls: 'degraded',    title: 'Service Degradation',                desc: 'Multiple Outlook endpoints are responding slowly.' },
    { min: 50, icon: '🔶', cls: 'outage',      title: 'Partial Outlook Outage',             desc: 'Some Outlook services are currently unreachable.' },
    { min: 25, icon: '🔴', cls: 'outage',      title: 'Major Outlook Outage',               desc: 'A significant portion of Outlook services are down.' },
    { min: 0,  icon: '🚨', cls: 'critical',    title: 'Critical Outlook Outage',            desc: 'Most Outlook and Exchange services are unresponsive.' }
  ];

  function getSev(score) {
    for (const s of SEVERITY) {
      if (score >= s.min) return s;
    }
    return SEVERITY[SEVERITY.length - 1];
  }

  function calcScore(services) {
    if (!services.length) return 0;
    let score = 0;
    for (const s of services) {
      if (s.status === 'up') score += 100;
      else if (s.status === 'degraded') score += 50;
    }
    return Math.round(score / services.length);
  }

  function shortName(name) {
    return name
      .replace(/\s*\(.*?\)\s*/g, '')
      .replace('Microsoft ', '')
      .replace('Outlook ', '')
      .replace('REST API', 'API')
      .replace('Mail API', 'Mail')
      .replace('Mobile Sync', 'Sync')
      .replace('MX (Mail Delivery)', 'MX')
      .replace('DNS (MX via TCP)', 'MX')
      .replace('SMTP (Port 587)', 'SMTP')
      .replace('Azure AD Auth', 'Azure AD')
      .replace('Graph API', 'Graph')
      .replace('365 Portal', 'M365');
  }

  function barColor(score) {
    if (score >= 90) return 'green';
    if (score >= 70) return 'yellow';
    if (score >= 40) return 'orange';
    return 'red';
  }

  function render(services) {
    const el = document.getElementById('modalStatus');
    const score = calcScore(services);
    const sev = getSev(score);
    const upCount = services.filter(s => s.status === 'up').length;
    const total = services.length;

    let gridHtml = '';
    for (const s of services) {
      const cls = s.status === 'up' ? 'up' : s.status === 'degraded' ? 'degraded' : 'down';
      const badge = s.status === 'up' ? 'OK' : s.status === 'degraded' ? 'SLOW' : 'DOWN';
      const rt = s.time ? `${s.time}ms` : '—';
      gridHtml += `
        <div class="svc">
          <div class="svc-dot ${cls}"></div>
          <div class="svc-info">
            <div class="svc-name">${shortName(s.name)}</div>
            <div class="svc-meta">${rt} · ${s.uptimeDay || s.uptime}</div>
          </div>
          <div class="svc-badge ${cls}">${badge}</div>
        </div>`;
    }

    const pipCls = score >= 90 ? '' : score >= 50 ? 'warn' : 'alert';

    el.innerHTML = `
      <div class="sev-header">
        <div class="sev-icon ${sev.cls}">${sev.icon}</div>
        <div>
          <div class="sev-title">${sev.title}</div>
          <div class="sev-subtitle">${sev.desc}</div>
        </div>
      </div>

      <div class="health-bar-wrap">
        <div class="health-bar-labels">
          <span>Service Health</span>
          <span class="health-pct">${upCount}/${total} services up</span>
        </div>
        <div class="health-bar">
          <div class="health-bar-fill ${barColor(score)}" style="width: ${score}%"></div>
        </div>
      </div>

      <div class="service-grid">${gridHtml}</div>

      <div class="modal-footer">
        <div class="modal-footer-left">
          <div class="live-pip ${pipCls}"></div>
          <span>Auto-refreshes every 60s</span>
        </div>
        <a href="${CONFIG.statusPageUrl}" target="_blank">View full dashboard →</a>
      </div>`;
  }

  async function fetchStatus() {
    try {
      const url = `https://raw.githubusercontent.com/${CONFIG.owner}/${CONFIG.repo}/master/history/summary.json`;
      const resp = await fetch(url + '?t=' + Date.now());
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      render(await resp.json());
    } catch (e) {
      console.error('Fetch failed:', e);
      document.getElementById('modalStatus').innerHTML = `
        <div class="loading">
          <div class="loading-text">⚠️ Unable to check Outlook status</div>
        </div>`;
    }
  }

  fetchStatus();
  setInterval(fetchStatus, CONFIG.refreshInterval);
})();
</script>
</body>
</html>
